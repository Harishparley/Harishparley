<svg width="100%" height="3" viewBox="0 0 1200 3" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B6914" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F4E4BC" stop-opacity="1">
        <animate attributeName="offset" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#8B6914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="3" fill="url(#divGold)"/>
