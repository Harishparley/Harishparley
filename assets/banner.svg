<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050403"/>
      <stop offset="50%" stop-color="#0F0C08"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="45%" stop-color="#F4E4BC"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0;-1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- fine gold hairline grid -->
  <g stroke="#8B6914" stroke-width="0.4" opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- art-deco corner frame, top-left -->
  <g stroke="#D4AF37" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M 40 30 H 140 M 40 30 V 90">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1160 270 H 1060 M 1160 270 V 210">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="40" cy="30" r="3" fill="#D4AF37"/>
  <circle cx="1160" cy="270" r="3" fill="#D4AF37"/>

  <!-- rising embers -->
  <g fill="#D4AF37">
    <circle cx="120" cy="260" r="1.6" opacity="0.7">
      <animate attributeName="cy" values="270;20;270" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="250" r="1.3" opacity="0.6">
      <animate attributeName="cy" values="260;10;260" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="270" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="280;40;280" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="255" r="1.4" opacity="0.6">
      <animate attributeName="cy" values="260;30;260" dur="8.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">HARISH PARLEY</text>

  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="6" fill="#B8A576" opacity="0.9">FULL STACK MERN DEVELOPER  ·  AI &amp; LLM INTEGRATION</text>

  <rect x="560" y="212" width="80" height="1" fill="#D4AF37" opacity="0.7">
    <animate attributeName="width" values="0;80;80;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;560;560;600" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="212.5" r="2.5" fill="#F4E4BC">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
