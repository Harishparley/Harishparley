<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0714"/>
      <stop offset="45%" stop-color="#1B0F33"/>
      <stop offset="100%" stop-color="#0A0714"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#F472B6;#818CF8;#A78BFA" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E9D5FF">
        <animate attributeName="stop-color" values="#E9D5FF;#A78BFA;#F472B6;#E9D5FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#818CF8;#A78BFA;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orb"><feGaussianBlur stdDeviation="45"/></filter>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#A78BFA" opacity="0.18"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <circle cx="160" cy="70" r="95" fill="#8B5CF6" opacity="0.32" filter="url(#orb)">
    <animate attributeName="cx" values="160;240;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;130;70" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="230" r="115" fill="#EC4899" opacity="0.26" filter="url(#orb)">
    <animate attributeName="cx" values="1040;960;1040" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;170;230" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="50" r="75" fill="#6366F1" opacity="0.28" filter="url(#orb)">
    <animate attributeName="cy" values="50;105;50" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="240" r="60" fill="#C4B5FD" opacity="0.2" filter="url(#orb)">
    <animate attributeName="cx" values="300;360;300" dur="13s" repeatCount="indefinite"/>
  </circle>

  <line x1="0" y1="0" x2="0" y2="300" stroke="#C4B5FD" stroke-width="1.5" opacity="0.35">
    <animate attributeName="x1" values="-50;1250;-50" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-50;1250;-50" dur="14s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#textGrad)" filter="url(#glow)">HARISH PARLEY</text>

  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="3" fill="#C4B5FD" opacity="0.95">FULL STACK MERN DEVELOPER  ·  AI &amp; LLM INTEGRATION</text>

  <rect x="500" y="215" width="200" height="2" rx="1" fill="url(#textGrad)" opacity="0.8">
    <animate attributeName="width" values="0;200;200;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;500;500;600" dur="4s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
