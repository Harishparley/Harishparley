name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Harishparley&background=0B0906&ring=D4AF37&fire=F4E4BC&currStreakLabel=D4AF37&sideLabels=8B6914&currStreakNum=F4E4BC&sideNums=E8D5B7&dates=8B6914&border=8B6914
          path: assets/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push
