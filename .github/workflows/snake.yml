name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Harishparley
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F4E4BC&color_dots=%23161310,%234A3510,%238B6914,%23C9A227,%23F4E4BC
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F4E4BC&color_dots=%23161310,%234A3510,%238B6914,%23C9A227,%23F4E4BC

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
