name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Harishparley
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=E8A33D&color_dots=161A1F,0F3D33,128C6B,00D68F,E8A33D
            dist/github-contribution-grid-snake-dark.svg?color_snake=E8A33D&color_dots=161A1F,0F3D33,128C6B,00D68F,E8A33D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
